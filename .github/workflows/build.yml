name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Arrange files
        run: |
          mkdir -p www resources
          mv index.html manifest.json icon-192.png icon-512.png madani.mp4 turki.mp4 www/
          mv adhan.mp3 resources/
      - run: npm install
      - run: npx cap add android
      - name: Add adhan sound and permissions
        run: |
          mkdir -p android/app/src/main/res/raw
          cp resources/adhan.mp3 android/app/src/main/res/raw/adhan.mp3
          for p in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE WAKE_LOCK ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION; do
            sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$p\"/>\n</manifest>#" android/app/src/main/AndroidManifest.xml
          done
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: adhan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
